basePath: /
host: localhost:8080
info:
  contact: {}
  description: API for the responding to the Client Side section of the Client Server
    Architecture
  title: Lattice API
  version: "1.0"
paths:
  /:
    get:
      description: This function call initialises the feature for google based authentication
        using Goth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Google Oauth function initialization
      tags:
      - Authentication
  /api/v1/auth/google:
    get:
      consumes:
      - application/json
      description: This function is used to call when a user wants to start the authentication
        using Google auth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin google authentication
      tags:
      - Authentication
  /api/v1/auth/google/callback:
    get:
      consumes:
      - application/json
      description: This function is used to call when a user wants to complete process
        of authentication using Google auth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin google authentication
      tags:
      - Authentication
  /health:
    get:
      description: Testing the first route
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: First Route
      tags:
      - Health
swagger: "2.0"
